<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンなぞなぞゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .btn {
            padding: 20px 30px;
            font-size: 1.5em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .riddle-container {
            margin-bottom: 30px;
        }

        .riddle-text {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            line-height: 1.6;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .choice-btn {
            padding: 20px;
            font-size: 1.3em;
            border: 3px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .choice-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .choice-btn.correct {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }

        .choice-btn.wrong {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .result-message {
            text-align: center;
            font-size: 2em;
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .result-message.correct {
            background: #d4edda;
            color: #155724;
        }

        .result-message.wrong {
            background: #f8d7da;
            color: #721c24;
        }

        .result-message.complete {
            background: #d1ecf1;
            color: #0c5460;
        }

        .score {
            text-align: center;
            font-size: 1.5em;
            margin: 20px 0;
            color: #667eea;
            font-weight: bold;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .collection-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #e9ecef;
        }

        .collection-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .collection-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .collection-item.locked:hover {
            transform: none;
            box-shadow: none;
        }

        .pokemon-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .pokemon-emoji {
            font-size: 2em;
        }

        .back-btn {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.2em;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .stats {
            text-align: center;
            margin: 20px 0;
            font-size: 1.3em;
            color: #495057;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .choices {
                grid-template-columns: 1fr;
            }

            .riddle-text {
                font-size: 1.4em;
            }

            .btn {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 ポケモンなぞなぞ 🎮</h1>

        <!-- メインメニュー -->
        <div id="menu-screen" class="screen active">
            <div class="menu-buttons">

                <button class="btn btn-secondary" onclick="showCollection()">ずかん</button>

            <div class="stats">

        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen">
            <div class="score">スコア: <span id="score">0</span></div>
            <div class="riddle-container">
                <div class="riddle-text" id="riddle-text"></div>
                <div class="choices" id="choices"></div>
            </div>
            <div id="result-container"></div>
            <button class="back-btn" onclick="showMenu()">メニューにもどる</button>
        </div>

        <!-- 図鑑画面 -->
        <div id="collection-screen" class="screen">

            <div class="collection-grid" id="collection-grid"></div>
            <button class="back-btn" onclick="showMenu()">メニューにもどる</button>

                choices: ["グレイシア", "イーブイ", "キュウコン（アローラ）", "フリーザー"],
                weight: 4,
                emoji: "❄️"
            },
            {
                id: 33,
                riddle: "エスパータイプの　むらさきの　ネコポケモン。\nイーブイが　ひるに　なついて　しんかした　すがた。\nたいようの　ひかりで　ちからが　でる。\nなんのポケモンかな？",
                answer: "エーフィ",
                choices: ["エーフィ", "イーブイ", "ブラッキー", "ニャース"],
                weight: 4,
                emoji: "🔮"
            },
            {
                id: 34,
                riddle: "あくタイプの　くろい　ポケモン。\nイーブイが　よるに　なついて　しんかした　すがた。\nつきの　ひかりで　ちからが　でて　からだが　ひかる。\nなんのポケモンかな？",
                answer: "ブラッキー",
                choices: ["ブラッキー", "イーブイ", "エーフィ", "ゾロアーク"],
                weight: 4,
                emoji: "🌙"
            },
            {
                id: 35,
                riddle: "はがね・じめんタイプの　グレーの　ヘビポケモン。\nイワークが　メタルコートを　もって　つうしんで　しんかした。\nダイヤモンドより　かたい　からだを　もつよ。\nなんのポケモンかな？",
                answer: "ハガネール",
                choices: ["ハガネール", "イワーク", "ボスゴドラ", "ドリュウズ"],
                weight: 3,
                emoji: "⛓️"
            },
            {
                id: 36,
                riddle: "ドラゴン・ひこうタイプの　あおい　ポケモン。\nタツベイが　２かい　しんかした　すがた。\nきょうぼうな　せいかくで　つばさを　もつ　ドラゴン。\nなんのポケモンかな？",
                answer: "ボーマンダ",
                choices: ["ボーマンダ", "タツベイ", "コモルー", "カイリュー"],
                weight: 4,
                emoji: "🐉"
            },
            {
                id: 37,
                riddle: "みずタイプの　ピンクと　クリームいろの　ポケモン。\nヒンバスが　うつくしさを　マックスにして　しんかした。\nとても　うつくしい　すがたで　みずべに　すむ。\nなんのポケモンかな？",
                answer: "ミロカロス",
                choices: ["ミロカロス", "ヒンバス", "ギャラドス", "ラプラス"],
                weight: 3,
                emoji: "🐍"
            },
            {
                id: 38,
                riddle: "でんきタイプの　きいろと　くろの　トラポケモン。\nジョウトちほうの　３せいじゅうの　１ひき。\nかみなりの　ような　スピードで　はしる。\nなんのポケモンかな？",
                answer: "ライコウ",
                choices: ["ライコウ", "エンテイ", "スイクン", "サンダー"],
                weight: 3,
                emoji: "⚡"
            },
            {
                id: 39,
                riddle: "ほのおタイプの　ちゃいろの　ライオンポケモン。\nジョウトちほうの　３せいじゅうの　１ひき。\nかざんの　ふんかと　ともに　うまれた　でんせつのポケモン。\nなんのポケモンかな？",
                answer: "エンテイ",
                choices: ["エンテイ", "ライコウ", "スイクン", "ファイヤー"],
                weight: 3,
                emoji: "🔥"
            },
            {
                id: 40,
                riddle: "みずタイプの　あおい　ヒョウポケモン。\nジョウトちほうの　３せいじゅうの　１ひき。\nきたかぜの　うまれかわりで　みずを　きよめる　ちからを　もつ。\nなんのポケモンかな？",
                answer: "スイクン",
                choices: ["スイクン", "ライコウ", "エンテイ", "フリーザー"],
                weight: 3,
                emoji: "💎"
            }
        ];

        // ゲーム状態
        let score = 0;
        let currentRiddle = null;
        let solvedRiddles = new Set();
        let answeredCorrectly = false;

        // ローカルストレージから進捗を読み込む
        function loadProgress() {
            const saved = localStorage.getItem('pokemon-nazonazo-progress');
            if (saved) {
                const data = JSON.parse(saved);
                solvedRiddles = new Set(data.solvedRiddles || []);
                score = data.score || 0;
            }
            updateStats();
        }

        // ローカルストレージに進捗を保存する
        function saveProgress() {
            const data = {
                solvedRiddles: Array.from(solvedRiddles),
                score: score
            };
            localStorage.setItem('pokemon-nazonazo-progress', JSON.stringify(data));
        }

        // 統計を更新
        function updateStats() {
            document.getElementById('total-solved').textContent = solvedRiddles.size;
            document.getElementById('total-riddles').textContent = riddles.length;
            document.getElementById('score').textContent = score;
        }

        // スタートボタンの状態を更新
        function updateStartButton() {
            const startBtn = document.getElementById('start-btn');
            if (solvedRiddles.size >= riddles.length) {
                startBtn.disabled = true;
                startBtn.textContent = 'ずかんコンプリート！🎉';
            } else {
                startBtn.disabled = false;
                startBtn.textContent = 'なぞなぞスタート！';
            }
        }

        // Fisher-Yates シャッフルアルゴリズム
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 重み付きランダム選択（未解決のポケモンのみ）
        function getWeightedRandomRiddle() {
            // 未解決のポケモンのみをフィルタリング
            const unsolvedRiddles = riddles.filter(riddle => !solvedRiddles.has(riddle.id));
            
            // すべてクリアしている場合
            if (unsolvedRiddles.length === 0) {
                return null;
            }
            
            const totalWeight = unsolvedRiddles.reduce((sum, riddle) => sum + riddle.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (let riddle of unsolvedRiddles) {
                random -= riddle.weight;
                if (random <= 0) {
                    return riddle;
                }
            }
            
            return unsolvedRiddles[0];
        }

        // ゲーム開始
        function startGame() {
            answeredCorrectly = false;
            currentRiddle = getWeightedRandomRiddle();
            
            // すべてクリアしている場合
            if (currentRiddle === null) {
                const resultContainer = document.getElementById('result-container');
                resultContainer.innerHTML = `
                    <div class="result-message complete">
                        🎉🎉🎉<br>
                        ずかんコンプリート！<br>
                        おめでとう！<br>
                        🎉🎉🎉
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-secondary" onclick="showCollection()">ずかんを　みる</button>
                    </div>
                `;
                document.getElementById('riddle-text').textContent = '';
                document.getElementById('choices').innerHTML = '';
                showScreen('game-screen');
                return;
            }
            
            document.getElementById('riddle-text').textContent = currentRiddle.riddle;
            
            // 選択肢を表示
            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';
            
            // シャッフルした選択肢を表示
            const shuffledChoices = shuffleArray(currentRiddle.choices);
            
            shuffledChoices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice;
                button.onclick = () => checkAnswer(choice, button);
                choicesContainer.appendChild(button);
            });
            
            document.getElementById('result-container').innerHTML = '';
            showScreen('game-screen');
        }

        // 答えをチェック
        function checkAnswer(selectedAnswer, button) {
            if (answeredCorrectly) return;
            
            const allButtons = document.querySelectorAll('.choice-btn');
            allButtons.forEach(btn => btn.style.pointerEvents = 'none');
            
            const resultContainer = document.getElementById('result-container');
            
            if (selectedAnswer === currentRiddle.answer) {
                button.classList.add('correct');
                score += 10;
                answeredCorrectly = true;
                solvedRiddles.add(currentRiddle.id);
                
                resultContainer.innerHTML = `
                    <div class="result-message correct">
                        🎉 せいかい！ ${currentRiddle.emoji}<br>
                        ${currentRiddle.answer}だよ！
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" onclick="startGame()">つぎのもんだい</button>
                    </div>
                `;
                
                saveProgress();
                updateStats();
                updateStartButton();
            } else {
                button.classList.add('wrong');
                
                // 正解のボタンを表示
                allButtons.forEach(btn => {
                    if (btn.textContent === currentRiddle.answer) {
                        btn.classList.add('correct');
                    }
                });
                
                resultContainer.innerHTML = `
                    <div class="result-message wrong">
                        😢 ざんねん！<br>
                        せいかいは ${currentRiddle.answer} だよ！
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" onclick="startGame()">つぎのもんだい</button>
                    </div>
                `;
            }
        }

        // 図鑑を表示
        function showCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            
            riddles.forEach(riddle => {
                const item = document.createElement('div');
                item.className = 'collection-item';
                
                if (solvedRiddles.has(riddle.id)) {
                    item.innerHTML = `
                        <div class="pokemon-emoji">${riddle.emoji}</div>
                        <div class="pokemon-name">${riddle.answer}</div>
                    `;
                    item.onclick = () => playSpecificRiddle(riddle);
                } else {
                    item.classList.add('locked');
                    item.innerHTML = `
                        <div class="pokemon-emoji">❓</div>
                        <div class="pokemon-name">？？？</div>
                    `;
                }
                
                grid.appendChild(item);
            });
            
            showScreen('collection-screen');
        }

        // 特定のなぞなぞを再生
        function playSpecificRiddle(riddle) {
            answeredCorrectly = false;
            currentRiddle = riddle;
            
            document.getElementById('riddle-text').textContent = riddle.riddle;
            
            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';
            
            const shuffledChoices = shuffleArray(riddle.choices);
            
            shuffledChoices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice;
                button.onclick = () => checkAnswer(choice, button);
                choicesContainer.appendChild(button);
            });
            
            document.getElementById('result-container').innerHTML = '';
            showScreen('game-screen');
        }

        // メニューを表示
        function showMenu() {
            showScreen('menu-screen');
            updateStats();
            updateStartButton();
        }

        // 画面を切り替え
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // 初期化
        loadProgress();
        updateStartButton();
    </script>
</body>
