<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケモンなぞなぞゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .btn {
            padding: 20px 30px;
            font-size: 1.5em;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .riddle-container {
            margin-bottom: 30px;
        }

        .riddle-text {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            line-height: 1.6;
        }

        .choices {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .choice-btn {
            padding: 20px;
            font-size: 1.3em;
            border: 3px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .choice-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .choice-btn.correct {
            background: #28a745;
            border-color: #28a745;
            color: white;
        }

        .choice-btn.wrong {
            background: #dc3545;
            border-color: #dc3545;
            color: white;
        }

        .result-message {
            text-align: center;
            font-size: 2em;
            margin: 20px 0;
            padding: 20px;
            border-radius: 10px;
            font-weight: bold;
        }

        .result-message.correct {
            background: #d4edda;
            color: #155724;
        }

        .result-message.wrong {
            background: #f8d7da;
            color: #721c24;
        }

        .result-message.complete {
            background: #d1ecf1;
            color: #0c5460;
        }

        .score {
            text-align: center;
            font-size: 1.5em;
            margin: 20px 0;
            color: #667eea;
            font-weight: bold;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .collection-item {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid #e9ecef;
        }

        .collection-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .collection-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .collection-item.locked:hover {
            transform: none;
            box-shadow: none;
        }

        .pokemon-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }

        .pokemon-emoji {
            font-size: 2em;
        }

        .back-btn {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.2em;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .stats {
            text-align: center;
            margin: 20px 0;
            font-size: 1.3em;
            color: #495057;
        }

        /* タイムアタック用スタイル */
        .timer-display {
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .timer-display.warning {
            color: #dc3545;
            animation: blink 0.5s infinite;
        }

        .time-attack-stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 1.3em;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .ranking-list {
            margin: 20px 0;
        }

        .ranking-item {
            padding: 20px;
            margin: 10px 0;
            background: #f8f9fa;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .ranking-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .ranking-rank {
            font-size: 1.5em;
            font-weight: bold;
            min-width: 80px;
        }

        .ranking-score {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .ranking-accuracy {
            color: #6c757d;
        }

        .ranking-date {
            color: #6c757d;
            font-size: 0.9em;
        }

        .effect-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
        }

        .effect-text {
            font-size: 3em;
            font-weight: bold;
            animation: popup 0.5s ease-out;
        }

        .sparkle {
            position: absolute;
            font-size: 2em;
            animation: sparkle 1s ease-out;
        }

        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            color: white;
            font-size: 5em;
            font-weight: bold;
        }

        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            animation: confetti 3s linear;
            z-index: 1500;
        }

        .result-stats {
            text-align: center;
            margin: 30px 0;
        }

        .result-stats-item {
            font-size: 1.8em;
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .result-rank-icon {
            font-size: 3em;
            margin: 20px 0;
            animation: popup 0.8s ease-out;
        }

        /* CSSアニメーション */
        @keyframes sparkle {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
            100% { opacity: 0; transform: scale(0) rotate(360deg); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px currentColor; }
            50% { box-shadow: 0 0 20px currentColor, 0 0 30px currentColor; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes countUp {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); color: #ffd700; }
            100% { transform: scale(1); }
        }

        @keyframes confetti {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @keyframes popup {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .glow-green {
            animation: glow 0.5s ease-in-out 2;
            border-color: #28a745 !important;
            background: #28a745 !important;
            color: white !important;
        }

        .glow-red {
            animation: glow 0.5s ease-in-out 2;
            border-color: #dc3545 !important;
            background: #dc3545 !important;
            color: white !important;
        }

        .shake-screen {
            animation: shake 0.5s ease-in-out;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8em;
            }

            .choices {
                grid-template-columns: 1fr;
            }

            .riddle-text {
                font-size: 1.4em;
            }

            .btn {
                font-size: 1.2em;
            }

            .timer-display {
                font-size: 1.8em;
            }

            .effect-text {
                font-size: 2em;
            }

            .countdown-overlay {
                font-size: 3em;
            }
        }

        /* ===== 全部入りアップグレード追加分 ===== */
        body {
            background: linear-gradient(135deg, #ffcb05 0%, #ff7847 45%, #3d7dca 100%);
            background-size: 200% 200%;
            animation: bgMove 18s ease infinite;
        }
        @keyframes bgMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .container { animation: popIn 0.45s ease-out; }
        @keyframes popIn {
            0% { transform: scale(0.96); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pokeball {
            display: inline-block;
            width: 0.72em; height: 0.72em;
            border-radius: 50%;
            border: 0.06em solid #222;
            background: linear-gradient(to bottom, #ee1515 0 46%, #222 46% 54%, #f8f8f8 54% 100%);
            position: relative;
            vertical-align: baseline;
            animation: ballWiggle 2.4s ease-in-out infinite;
        }
        @keyframes ballWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-14deg); }
            75% { transform: rotate(14deg); }
        }
        .sound-btn {
            position: fixed;
            top: 14px; right: 14px;
            z-index: 3000;
            font-size: 1.5em;
            padding: 10px 14px;
            border: none; border-radius: 999px;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            cursor: pointer;
        }
        .sound-btn:active { transform: scale(0.92); }
        .progress-wrap {
            max-width: 400px; margin: 12px auto 4px;
            background: #e9ecef; border-radius: 999px; height: 18px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #28a745, #8be26b);
            border-radius: 999px;
            transition: width 0.6s ease;
        }
        .btn-review {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #5b3100;
        }
        .btn-review:disabled { opacity: 0.45; }
        .reset-link {
            margin-top: 14px;
            background: none; border: none;
            color: #868e96; font-size: 0.95em;
            text-decoration: underline; cursor: pointer;
        }
        .stage {
            text-align: center;
            margin: 6px 0 14px;
        }
        .stage-circle {
            width: 150px; height: 150px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 35%, #fff8d6 0%, #ffe29a 55%, #ffcb05 100%);
            border: 5px solid #3d7dca;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 18px rgba(0,0,0,0.18);
            overflow: hidden;
        }
        .stage-emoji {
            font-size: 5em;
            transition: filter 0.5s ease, transform 0.3s ease;
        }
        .stage-emoji.silhouette { filter: blur(14px) grayscale(70%); transform: scale(1.05); }
        .stage-emoji.half { filter: blur(6px) grayscale(30%); }
        .stage-emoji.revealed { animation: revealPop 0.55s ease-out; }
        @keyframes revealPop {
            0% { transform: scale(0.4) rotate(-16deg); }
            60% { transform: scale(1.25) rotate(6deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .stage-name {
            min-height: 1.5em;
            font-size: 1.4em; font-weight: bold; color: #3d7dca;
            margin-top: 8px;
        }
        .combo-display {
            text-align: center;
            font-size: 1.25em; font-weight: bold;
            color: #e8590c; min-height: 1.4em;
        }
        .combo-display.bump { animation: countUp 0.35s ease-out; }
        .hint-area {
            max-width: 520px; margin: 0 auto 14px;
            text-align: center;
        }
        .hint-btn {
            padding: 12px 22px;
            font-size: 1.15em; font-weight: bold;
            border: 3px dashed #f59f00;
            background: #fff9db; color: #a66a00;
            border-radius: 12px; cursor: pointer;
        }
        .hint-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .hint-text {
            margin-top: 10px;
            font-size: 1.15em; color: #7a5200;
            line-height: 1.7; white-space: pre-line;
        }
        .choice-btn.eliminated {
            opacity: 0.25; text-decoration: line-through;
            pointer-events: none; transform: none !important;
        }
        .score-pop {
            position: fixed; z-index: 2500;
            font-size: 2em; font-weight: bold; color: #ffd43b;
            text-shadow: 2px 2px 0 #e8590c;
            pointer-events: none;
            animation: scoreFloat 0.9s ease-out forwards;
        }
        @keyframes scoreFloat {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            25% { opacity: 1; transform: translateY(-14px) scale(1.15); }
            100% { transform: translateY(-64px) scale(1); opacity: 0; }
        }
        .mode-label {
            text-align: center; font-size: 1.1em; font-weight: bold;
            color: #a66a00; min-height: 1.3em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="pokeball"></span> ポケモンなぞなぞ <span class="pokeball"></span></h1>

        <!-- メインメニュー -->
        <div id="menu-screen" class="screen active">
            <div class="menu-buttons">
                <button id="start-btn" class="btn btn-primary" onclick="startGame()" aria-label="なぞなぞスタート">なぞなぞスタート！</button>
                <button class="btn btn-secondary" onclick="startTimeAttack()" aria-label="タイムアタックモード">⏱️ タイムアタック！</button>
                <button class="btn btn-secondary" onclick="showCollection()" aria-label="ポケモンずかん">ずかん</button>
                <button class="btn btn-secondary" onclick="showRankings()" aria-label="ランキング">🏆 ランキング</button>
                <button id="review-btn" class="btn btn-review" onclick="startReview()" aria-label="にがてふくしゅう">📚 にがてふくしゅう（<span id="wrong-count">0</span>もん）</button>
            </div>
            <div class="stats">
                <p>クリアしたなぞなぞ: <span id="total-solved">0</span> / <span id="total-riddles">0</span></p>
                <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
                <p>スコア: <span id="menu-score">0</span>てん</p>
                <button class="reset-link" onclick="resetProgress()">データを リセット</button>
            </div>
        </div>

        <!-- ゲーム画面 -->
        <div id="game-screen" class="screen">
            <div class="mode-label" id="mode-label"></div>
            <div class="score">スコア: <span id="score">0</span></div>
            <div class="combo-display" id="combo-display"></div>
            <div class="stage">
                <div class="stage-circle"><div class="stage-emoji silhouette" id="stage-emoji">❓</div></div>
                <div class="stage-name" id="stage-name"></div>
            </div>
            <div class="riddle-container">
                <div class="riddle-text" id="riddle-text"></div>
                <div class="choices" id="choices"></div>
            </div>
            <div class="hint-area">
                <button class="hint-btn" id="hint-btn" onclick="useHint()">💡 ヒント（あと3かい）</button>
                <div class="hint-text" id="hint-text"></div>
            </div>
            <div id="result-container"></div>
            <button class="back-btn" onclick="showMenu()">メニューにもどる</button>
        </div>

        <!-- 図鑑画面 -->
        <div id="collection-screen" class="screen">
            <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">ポケモンずかん</h2>
            <div class="collection-grid" id="collection-grid"></div>
            <button class="back-btn" onclick="showMenu()">メニューにもどる</button>
        </div>

        <!-- タイムアタック画面 -->
        <div id="time-attack-screen" class="screen">
            <div class="timer-display" id="timer-display">⏱️ 残り: 60秒</div>
            <div class="time-attack-stats">
                <div class="stat-item">
                    <div>🎯 正解</div>
                    <div class="stat-value" id="ta-correct">0</div>
                </div>
                <div class="stat-item">
                    <div>📊 回答</div>
                    <div class="stat-value" id="ta-total">0</div>
                </div>
            </div>
            <div class="riddle-container">
                <div class="riddle-text" id="ta-riddle-text"></div>
                <div class="choices" id="ta-choices"></div>
            </div>
            <button class="back-btn" onclick="endTimeAttack()">メニューにもどる</button>
        </div>

        <!-- タイムアタック結果画面 -->
        <div id="time-attack-result-screen" class="screen">
            <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">🎉 結果発表！</h2>
            <div class="result-stats">
                <div class="result-stats-item">正解数: <span id="result-correct">0</span>問</div>
                <div class="result-stats-item">回答数: <span id="result-total">0</span>問</div>
                <div class="result-stats-item">正解率: <span id="result-accuracy">0</span>%</div>
            </div>
            <div class="result-rank-icon" id="result-rank-icon"></div>
            <div class="menu-buttons" style="margin-top: 30px;">
                <button class="btn btn-primary" onclick="startTimeAttack()">もう一度挑戦</button>
                <button class="btn btn-secondary" onclick="showRankings()">ランキングを見る</button>
                <button class="back-btn" onclick="showMenu()">メニューにもどる</button>
            </div>
        </div>

        <!-- ランキング画面 -->
        <div id="ranking-screen" class="screen">
            <h2 style="text-align: center; color: #667eea; margin-bottom: 20px;">🏆 タイムアタックランキング</h2>
            <div class="ranking-list" id="ranking-list"></div>
            <button class="back-btn" onclick="showMenu()">メニューにもどる</button>
        </div>
    </div>

    <button class="sound-btn" id="sound-btn" onclick="toggleSound()" aria-label="おとの オン・オフ">🔊</button>

    <!-- エフェクトコンテナ -->
    <div id="effect-container" class="effect-container"></div>

    <script>
        // ポケモンなぞなぞデータ（人気ポケモン優先）
        const riddles = [
            // 最も人気のあるポケモン（高頻度）
            {
                id: 1,
                riddle: "でんきタイプの　きいろい　ネズミポケモン。\nほっぺが　まるくて　でんきを　ためる。\n「10まんボルト」が　とくいわざだよ。\nなんのポケモンかな？",
                answer: "ピカチュウ",
                choices: ["ピカチュウ", "ライチュウ", "デデンネ", "エモンガ"],
                weight: 5,
                emoji: "⚡"
            },
            {
                id: 2,
                riddle: "みずタイプの　あおい　カメポケモン。\nこうらに　かくれて　みずでっぽうを　うつ。\nゼニガメだんの　リーダーも　いたよ。\nなんのポケモンかな？",
                answer: "ゼニガメ",
                choices: ["ゼニガメ", "カメール", "カメックス", "ミズゴロウ"],
                weight: 5,
                emoji: "💧"
            },
            {
                id: 3,
                riddle: "ほのおタイプの　オレンジいろの　トカゲポケモン。\nしっぽの　ほのおが　きえると　いのちが　きえる。\nサトシの　そだてた　１ぴき目の　ポケモンだよ。\nなんのポケモンかな？",
                answer: "ヒトカゲ",
                choices: ["ヒトカゲ", "リザード", "リザードン", "アチャモ"],
                weight: 5,
                emoji: "🔥"
            },
            {
                id: 4,
                riddle: "くさ・どくタイプの　みどりの　ポケモン。\nせなかに　たねが　ついていて　ひかりで　そだつ。\nカントーちほうの　さいしょの　ポケモンだよ。\nなんのポケモンかな？",
                answer: "フシギダネ",
                choices: ["フシギダネ", "フシギソウ", "フシギバナ", "キモリ"],
                weight: 5,
                emoji: "🌱"
            },

        let score = 0;

        let answeredCorrectly = false;
        let wrongRiddles = new Set();

        // ローカルストレージから進捗を読み込む
        function loadProgress() {
            const saved = localStorage.getItem('pokemon-nazonazo-progress');
            if (saved) {
                const data = JSON.parse(saved);
                solvedRiddles = new Set(data.solvedRiddles || []);
                wrongRiddles = new Set(data.wrongRiddles || []);
                score = data.score || 0;
            }
            updateStats();
        }

        // ローカルストレージに進捗を保存する
        function saveProgress() {
            const data = {
                solvedRiddles: Array.from(solvedRiddles),
                wrongRiddles: Array.from(wrongRiddles),
                score: score
            };
            localStorage.setItem('pokemon-nazonazo-progress', JSON.stringify(data));
        }

        // 統計を更新
        function updateStats() {
            document.getElementById('total-solved').textContent = solvedRiddles.size;
            document.getElementById('total-riddles').textContent = riddles.length;
            document.getElementById('score').textContent = score;
            const menuScore = document.getElementById('menu-score');
            if (menuScore) menuScore.textContent = score;
            const bar = document.getElementById('progress-bar');
            if (bar) bar.style.width = (riddles.length ? (solvedRiddles.size / riddles.length) * 100 : 0) + '%';
            const wc = document.getElementById('wrong-count');
            if (wc) wc.textContent = wrongRiddles.size;
            const rb = document.getElementById('review-btn');
            if (rb) rb.disabled = wrongRiddles.size === 0;
        }

        // スタートボタンの状態を更新
        function updateStartButton() {
            const startBtn = document.getElementById('start-btn');
            if (solvedRiddles.size >= riddles.length) {
                startBtn.disabled = true;
                startBtn.textContent = 'ずかんコンプリート！🎉';
            } else {
                startBtn.disabled = false;
                startBtn.textContent = 'なぞなぞスタート！';
            }
        }

        // Fisher-Yates シャッフルアルゴリズム
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 重み付きランダム選択（未解決のポケモンのみ）
        function getWeightedRandomRiddle() {
            // 未解決のポケモンのみをフィルタリング
            const unsolvedRiddles = riddles.filter(riddle => !solvedRiddles.has(riddle.id));
            
            // すべてクリアしている場合
            if (unsolvedRiddles.length === 0) {
                return null;
            }
            
            const totalWeight = unsolvedRiddles.reduce((sum, riddle) => sum + riddle.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (let riddle of unsolvedRiddles) {
                random -= riddle.weight;
                if (random <= 0) {
                    return riddle;
                }
            }
            
            return unsolvedRiddles[0];
        }

        // ゲーム開始
        function startGame() {
            gameMode = 'normal';
            const riddle = getWeightedRandomRiddle();

            // すべてクリアしている場合
            if (riddle === null) {
                showScreen('game-screen');
                document.getElementById('riddle-text').textContent = '';
                document.getElementById('choices').innerHTML = '';
                document.getElementById('mode-label').textContent = '';
                document.getElementById('stage-emoji').textContent = '🎉';
                document.getElementById('stage-emoji').className = 'stage-emoji revealed';
                document.getElementById('stage-name').textContent = '';
                document.getElementById('hint-btn').disabled = true;
                document.getElementById('hint-text').textContent = '';
                document.getElementById('result-container').innerHTML = `
                    <div class="result-message complete">
                        🎉🎉🎉<br>
                        ずかんコンプリート！<br>
                        おめでとう！<br>
                        🎉🎉🎉
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-secondary" onclick="showCollection()">ずかんを　みる</button>
                    </div>
                `;
                playSE('fanfare');
                showConfetti();
                return;
            }

            renderRiddle(riddle);
        }

        // なぞなぞを画面に出す（通常・ふくしゅう・図鑑から共通）
        function renderRiddle(riddle) {
            answeredCorrectly = false;
            questionLocked = false;
            hintsUsed = 0;
            currentRiddle = riddle;

            document.getElementById('riddle-text').textContent = riddle.riddle;

            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';

            shuffleArray(riddle.choices).forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice;
                button.onclick = () => checkAnswer(choice, button);
                choicesContainer.appendChild(button);
            });

            document.getElementById('result-container').innerHTML = '';

            // ステージ: 最初はぼんやりシルエット、正解で姿が現れる
            const stageEmoji = document.getElementById('stage-emoji');
            stageEmoji.textContent = riddle.emoji;
            stageEmoji.className = 'stage-emoji silhouette';
            document.getElementById('stage-name').textContent = '';

            // ヒントをリセット
            document.getElementById('hint-text').textContent = '';
            const hintBtn = document.getElementById('hint-btn');
            hintBtn.disabled = false;
            hintBtn.textContent = '💡 ヒント（あと3かい）';

            document.getElementById('mode-label').textContent =
                gameMode === 'review' ? '📚 にがてふくしゅう中' : '';
            updateComboDisplay();
            showScreen('game-screen');
        }

        // 「つぎのもんだい」ボタン（ふくしゅう中はふくしゅうの続きへ）
        function nextQuestion() {
            if (gameMode === 'review') {
                nextReview();
            } else {
                startGame();
            }
        }

        // にがてふくしゅう開始
        function startReview() {
            if (wrongRiddles.size === 0) return;
            gameMode = 'review';
            reviewQueue = shuffleArray(riddles.filter(r => wrongRiddles.has(r.id)));
            nextReview();
        }

        // ふくしゅうの次の問題
        function nextReview() {
            if (reviewQueue.length === 0) {
                gameMode = 'normal';
                showScreen('game-screen');
                document.getElementById('riddle-text').textContent = '';
                document.getElementById('choices').innerHTML = '';
                document.getElementById('mode-label').textContent = '';
                document.getElementById('stage-emoji').textContent = '🎉';
                document.getElementById('stage-emoji').className = 'stage-emoji revealed';
                document.getElementById('stage-name').textContent = '';
                document.getElementById('hint-btn').disabled = true;
                document.getElementById('hint-text').textContent = '';
                document.getElementById('result-container').innerHTML = `
                    <div class="result-message complete">
                        🎉 ふくしゅう　かんりょう！<br>
                        ${wrongRiddles.size === 0 ? 'にがては　ぜんぶ　こくふくしたよ！すごい！' : 'のこりの　にがては　また　こんど　がんばろう！'}
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" onclick="showMenu()">メニューにもどる</button>
                    </div>
                `;
                playSE('fanfare');
                showConfetti();
                return;
            }
            renderRiddle(reviewQueue.shift());
        }

        // ヒント（1: 最初の文字 / 2: 文字数＋少し見える / 3: 選択肢を2つ消す＋はっきり見える）
        function useHint() {
            if (!currentRiddle || questionLocked || hintsUsed >= 3) return;
            hintsUsed++;
            playSE('hint');
            const hintText = document.getElementById('hint-text');
            const core = currentRiddle.answer.split('（')[0];
            const stageEmoji = document.getElementById('stage-emoji');
            let line = '';
            if (hintsUsed === 1) {
                line = `ヒント1：なまえの　さいしょの　もじは「${core[0]}」だよ`;
            } else if (hintsUsed === 2) {
                line = `ヒント2：なまえは　${core.length}もじ。すがたが　すこし　みえてきた！`;
                stageEmoji.className = 'stage-emoji half';
            } else if (hintsUsed === 3) {
                line = 'ヒント3：ちがう　こたえを　2つ　けしたよ。すがたも　はっきり　みえる！';
                stageEmoji.className = 'stage-emoji';
                const wrongBtns = shuffleArray(
                    Array.from(document.querySelectorAll('#choices .choice-btn'))
                        .filter(b => b.textContent !== currentRiddle.answer)
                );
                wrongBtns.slice(0, 2).forEach(b => b.classList.add('eliminated'));
            }
            hintText.textContent = (hintText.textContent ? hintText.textContent + '\n' : '') + line;
            const hintBtn = document.getElementById('hint-btn');
            hintBtn.textContent = hintsUsed >= 3 ? '💡 ヒントは　おわり' : `💡 ヒント（あと${3 - hintsUsed}かい）`;
            hintBtn.disabled = hintsUsed >= 3;
        }

        // コンボ表示
        function updateComboDisplay() {
            const el = document.getElementById('combo-display');
            if (!el) return;
            el.textContent = comboCount >= 2 ? `🔥 ${comboCount}れんぞく　せいかい！` : '';
            if (comboCount >= 2) {
                el.classList.remove('bump');
                void el.offsetWidth;
                el.classList.add('bump');
            }
        }

        // ステージの姿を現す
        function revealStage() {
            const stageEmoji = document.getElementById('stage-emoji');
            stageEmoji.className = 'stage-emoji revealed';
            document.getElementById('stage-name').textContent = currentRiddle.answer;
        }

        // スコアの数字ポップ
        function showScorePop(points) {
            const el = document.createElement('div');
            el.className = 'score-pop';
            el.textContent = `+${points}てん`;
            el.style.left = '50%';
            el.style.top = '30%';
            document.body.appendChild(el);
            setTimeout(() => {
                if (document.body.contains(el)) document.body.removeChild(el);
            }, 950);
        }

        // データをリセット
        function resetProgress() {
            if (!confirm('データを　リセットしますか？\nずかん・スコア・にがてリストが　ぜんぶ　きえます。')) return;
            solvedRiddles = new Set();
            wrongRiddles = new Set();
            score = 0;
            comboCount = 0;
            localStorage.removeItem('pokemon-nazonazo-progress');
            localStorage.removeItem('pokemon-nazonazo-rankings');
            saveProgress();
            updateStats();
            updateStartButton();
            updateComboDisplay();
            playSE('pop');
            alert('リセットしたよ！');
        }

        // 答えをチェック
        function checkAnswer(selectedAnswer, button) {
            if (questionLocked) return;
            questionLocked = true;

            const allButtons = document.querySelectorAll('#choices .choice-btn');
            allButtons.forEach(btn => btn.style.pointerEvents = 'none');
            document.getElementById('hint-btn').disabled = true;

            const resultContainer = document.getElementById('result-container');

            if (selectedAnswer === currentRiddle.answer) {
                button.classList.add('correct');
                comboCount++;
                const comboBonus = Math.min((comboCount - 1) * 2, 10);
                let points = 10 + comboBonus;
                if (hintsUsed >= 3) points = 5 + comboBonus;
                score += points;
                answeredCorrectly = true;
                solvedRiddles.add(currentRiddle.id);
                const graduated = wrongRiddles.delete(currentRiddle.id);

                playSE('correct');
                showSparkles();
                revealStage();
                showScorePop(points);

                resultContainer.innerHTML = `
                    <div class="result-message correct">
                        🎉 せいかい！ ${currentRiddle.emoji}<br>
                        ${currentRiddle.answer}だよ！ +${points}てん
                        ${graduated ? '<br>にがてを　こくふくしたよ！🌟' : ''}
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" onclick="nextQuestion()">つぎのもんだい</button>
                    </div>
                `;

                if (solvedRiddles.size >= riddles.length) {
                    playSE('fanfare');
                    showConfetti();
                }
                saveProgress();
                updateStats();
                updateStartButton();
            } else {
                button.classList.add('wrong');
                comboCount = 0;
                wrongRiddles.add(currentRiddle.id);

                playSE('wrong');
                revealStage();

                allButtons.forEach(btn => {
                    if (btn.textContent === currentRiddle.answer) {
                        btn.classList.add('correct');
                    }
                });

                document.querySelector('.container').classList.add('shake-screen');
                setTimeout(() => {
                    document.querySelector('.container').classList.remove('shake-screen');
                }, 500);

                resultContainer.innerHTML = `
                    <div class="result-message wrong">
                        😢 ざんねん！<br>
                        せいかいは ${currentRiddle.answer} だよ！<br>
                        「にがてふくしゅう」に　いれたよ 📚
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-primary" onclick="nextQuestion()">つぎのもんだい</button>
                    </div>
                `;

                saveProgress();
                updateStats();
            }
            updateComboDisplay();
        }

        // 図鑑を表示
        function showCollection() {
            const grid = document.getElementById('collection-grid');
            grid.innerHTML = '';
            
            riddles.forEach(riddle => {
                const item = document.createElement('div');
                item.className = 'collection-item';
                
                if (solvedRiddles.has(riddle.id)) {
                    item.innerHTML = `
                        <div class="pokemon-emoji">${riddle.emoji}</div>
                        <div class="pokemon-name">${riddle.answer}</div>
                    `;
                    item.onclick = () => playSpecificRiddle(riddle);
                } else {
                    item.classList.add('locked');
                    item.innerHTML = `
                        <div class="pokemon-emoji">❓</div>
                        <div class="pokemon-name">？？？</div>
                    `;
                }
                
                grid.appendChild(item);
            });
            
            showScreen('collection-screen');
        }

        // 特定のなぞなぞを再生
        function playSpecificRiddle(riddle) {
            gameMode = 'single';
            renderRiddle(riddle);
        }

        // メニューを表示
        function showMenu() {
            showScreen('menu-screen');
            updateStats();
            updateStartButton();
        }

        // 画面を切り替え
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // タイムアタック関連の変数
        let timeAttackTimer = null;
        let timeRemaining = 60;
        let taCorrectCount = 0;
        let taTotalCount = 0;
        let taCurrentRiddle = null;
        let taComboCount = 0;
        let taAnsweredCorrectly = false;

        // タイムアタック開始
        function startTimeAttack() {
            showCountdown(() => {
                timeRemaining = 60;
                taCorrectCount = 0;
                taTotalCount = 0;
                taComboCount = 0;
                updateTimeAttackStats();
                showScreen('time-attack-screen');
                loadNextTimeAttackRiddle();
                startTimer();
            });
        }

        // カウントダウン表示
        function showCountdown(callback) {
            const overlay = document.createElement('div');
            overlay.className = 'countdown-overlay';
            document.body.appendChild(overlay);
            
            let count = 3;
            overlay.textContent = count;
            playSE('count');
            
            const countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    overlay.textContent = count;
            playSE('count');
                } else if (count === 0) {
                    overlay.textContent = 'GO！🚀';
                    playSE('go');
                } else {
                    clearInterval(countdownInterval);
                    document.body.removeChild(overlay);
                    callback();
                }
            }, 1000);
        }

        // タイマー開始
        function startTimer() {
            updateTimerDisplay();
            timeAttackTimer = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 5 && timeRemaining > 0) {
                    playSE('tick');
                }

                if (timeRemaining <= 10 && timeRemaining > 0) {
                    document.getElementById('timer-display').classList.add('warning');
                }
                
                if (timeRemaining === 5) {
                    showEffectText('⚠️ あと5秒！');
                }
                
                if (timeRemaining <= 0) {
                    endTimeAttackGame();
                }
            }, 1000);
        }

        // タイマー表示更新
        function updateTimerDisplay() {
            const timerDisplay = document.getElementById('timer-display');
            timerDisplay.textContent = `⏱️ 残り: ${timeRemaining}秒`;
            if (timeRemaining <= 10) {
                timerDisplay.classList.add('warning');
            } else {
                timerDisplay.classList.remove('warning');
            }
        }

        // タイムアタック統計更新
        function updateTimeAttackStats() {
            document.getElementById('ta-correct').textContent = taCorrectCount;
            document.getElementById('ta-total').textContent = taTotalCount;
        }

        // 次のなぞなぞを読み込み（完全ランダム）
        function loadNextTimeAttackRiddle() {
            taAnsweredCorrectly = false;
            taCurrentRiddle = riddles[Math.floor(Math.random() * riddles.length)];
            
            document.getElementById('ta-riddle-text').textContent = taCurrentRiddle.riddle;
            
            const choicesContainer = document.getElementById('ta-choices');
            choicesContainer.innerHTML = '';
            
            const shuffledChoices = shuffleArray(taCurrentRiddle.choices);
            
            shuffledChoices.forEach(choice => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice;
                button.onclick = () => checkTimeAttackAnswer(choice, button);
                choicesContainer.appendChild(button);
            });
        }

        // タイムアタック回答チェック
        function checkTimeAttackAnswer(selectedAnswer, button) {
            if (taAnsweredCorrectly) return;
            
            taAnsweredCorrectly = true;
            taTotalCount++;
            
            const allButtons = document.querySelectorAll('#ta-choices .choice-btn');
            allButtons.forEach(btn => btn.style.pointerEvents = 'none');
            
            if (selectedAnswer === taCurrentRiddle.answer) {
                button.classList.add('glow-green');
                playSE('correct');
                taCorrectCount++;
                taComboCount++;
                showCorrectEffect();
                showComboEffect(taComboCount);
                
                // 少し待ってから次の問題へ
                setTimeout(() => {
                    updateTimeAttackStats();
                    loadNextTimeAttackRiddle();
                }, 800);
            } else {
                button.classList.add('glow-red');
                playSE('wrong');
                taComboCount = 0;
                showWrongEffect();
                
                // 正解ボタンを光らせる
                allButtons.forEach(btn => {
                    if (btn.textContent === taCurrentRiddle.answer) {
                        btn.classList.add('glow-green');
                    }
                });
                
                // 画面を揺らす
                document.querySelector('.container').classList.add('shake-screen');
                setTimeout(() => {
                    document.querySelector('.container').classList.remove('shake-screen');
                }, 500);
                
                // 少し待ってから次の問題へ
                setTimeout(() => {
                    updateTimeAttackStats();
                    loadNextTimeAttackRiddle();
                }, 1000);
            }
        }

        // 正解エフェクト
        function showCorrectEffect() {
            showEffectText('ピコーン♪✨');
            showSparkles();
        }

        // 不正解エフェクト
        function showWrongEffect() {
            showEffectText('ブブー💦');
        }

        // コンボエフェクト
        function showComboEffect(combo) {
            let message = '';
            if (combo === 3) {
                message = 'グッド！👍';
            } else if (combo === 5) {
                message = 'すごい！🔥';
            } else if (combo === 10) {
                message = 'パーフェクト！⭐⭐⭐';
            } else if (combo === 15) {
                message = 'レジェンド！👑';
            }
            
            if (message) {
                setTimeout(() => showEffectText(message), 500);
            }
        }

        // エフェクトテキスト表示
        function showEffectText(text) {
            const container = document.getElementById('effect-container');
            const effectText = document.createElement('div');
            effectText.className = 'effect-text';
            effectText.textContent = text;
            container.appendChild(effectText);
            
            setTimeout(() => {
                container.removeChild(effectText);
            }, 1000);
        }

        // キラキラエフェクト
        function showSparkles() {
            const symbols = ['⭐', '💫', '✨'];
            const container = document.getElementById('effect-container');
            
            for (let i = 0; i < 5; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                sparkle.style.left = `${Math.random() * 200 - 100}px`;
                sparkle.style.top = `${Math.random() * 200 - 100}px`;
                container.appendChild(sparkle);
                
                setTimeout(() => {
                    if (container.contains(sparkle)) {
                        container.removeChild(sparkle);
                    }
                }, 1000);
            }
        }

        // 紙吹雪エフェクト
        function showConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7', '#a29bfe'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti-piece';
                    confetti.style.left = `${Math.random() * 100}%`;
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = `${Math.random() * 0.5}s`;
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        if (document.body.contains(confetti)) {
                            document.body.removeChild(confetti);
                        }
                    }, 3000);
                }, i * 30);
            }
        }

        // タイムアタック終了（手動）
        function endTimeAttack() {
            if (timeAttackTimer) {
                clearInterval(timeAttackTimer);
                timeAttackTimer = null;
            }
            showMenu();
        }

        // タイムアタックゲーム終了
        function endTimeAttackGame() {
            if (timeAttackTimer) {
                clearInterval(timeAttackTimer);
                timeAttackTimer = null;
            }
            
            showEffectText('ピピピッ！⏰');
            playSE('timeup');
            
            setTimeout(() => {
                showTimeAttackResult();
            }, 1000);
        }

        // タイムアタック結果表示
        function showTimeAttackResult() {
            const accuracy = taTotalCount > 0 ? ((taCorrectCount / taTotalCount) * 100).toFixed(1) : 0;
            
            document.getElementById('result-correct').textContent = taCorrectCount;
            document.getElementById('result-total').textContent = taTotalCount;
            document.getElementById('result-accuracy').textContent = accuracy;
            
            // ランキングに保存
            const isNewRecord = saveRanking(taCorrectCount, taTotalCount, accuracy);
            
            // ランクアイコン表示
            const rankIcon = document.getElementById('result-rank-icon');
            if (isNewRecord) {
                rankIcon.textContent = '🎉 新記録！🎉';
                playSE('fanfare');
                if (isTop3(taCorrectCount)) {
                    showConfetti();
                }
            } else {
                rankIcon.textContent = '';
            }
            
            showScreen('time-attack-result-screen');
        }

        // ランキング保存
        function saveRanking(score, total, accuracy) {
            const rankings = loadRankings();
            const date = new Date().toLocaleDateString('ja-JP');
            
            const newEntry = {
                score: score,
                total: total,
                accuracy: parseFloat(accuracy),
                date: date
            };
            
            rankings.push(newEntry);
            
            // ソート: 正解数降順、正解率降順
            rankings.sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return b.accuracy - a.accuracy;
            });
            
            // 新記録かチェック（Top 10に入ったか）
            const newEntryIndex = rankings.findIndex(r => 
                r.score === score && r.total === total && r.accuracy === parseFloat(accuracy) && r.date === date
            );
            const isNewRecord = newEntryIndex < 10;
            
            // Top 10のみ保存
            const top10 = rankings.slice(0, 10);
            localStorage.setItem('pokemon-nazonazo-rankings', JSON.stringify(top10));
            
            return isNewRecord;
        }

        // ランキング読み込み
        function loadRankings() {
            const saved = localStorage.getItem('pokemon-nazonazo-rankings');
            return saved ? JSON.parse(saved) : [];
        }

        // Top 3入りチェック
        function isTop3(score) {
            const rankings = loadRankings();
            rankings.sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return b.accuracy - a.accuracy;
            });
            
            if (rankings.length < 3) return true;
            return score >= rankings[2].score;
        }

        // ランキング表示
        function showRankings() {
            const rankings = loadRankings();
            const container = document.getElementById('ranking-list');
            container.innerHTML = '';
            
            if (rankings.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 40px;">まだ記録がありません</p>';
            } else {
                const medals = ['🥇', '🥈', '🥉'];
                rankings.forEach((ranking, index) => {
                    const item = document.createElement('div');
                    item.className = 'ranking-item';
                    
                    const rank = index < 3 ? medals[index] : `${index + 1}位`;
                    
                    item.innerHTML = `
                        <div class="ranking-rank">${rank}</div>
                        <div style="flex: 1;">
                            <div class="ranking-score">${ranking.score}問 <span class="ranking-accuracy">(${ranking.accuracy}%)</span></div>
                            <div class="ranking-date">${ranking.date}</div>
                        </div>
                    `;
                    
                    container.appendChild(item);
                });
            }
            
            showScreen('ranking-screen');
        }

        // ===== おと（効果音とBGM、WebAudioで生成） =====
        let audioCtx = null;
        let bgmTimer = null;
        let bgmStep = 0;
        let soundOn = true;
        let bgmStarted = false;

        function loadSettings() {
            const s = localStorage.getItem('pokemon-nazonazo-settings');
            if (s) {
                try { soundOn = JSON.parse(s).soundOn !== false; } catch (e) { /* 壊れた設定は無視 */ }
            }
            updateSoundButton();
        }

        function saveSettings() {
            localStorage.setItem('pokemon-nazonazo-settings', JSON.stringify({ soundOn: soundOn }));
        }

        function updateSoundButton() {
            const b = document.getElementById('sound-btn');
            if (b) b.textContent = soundOn ? '🔊' : '🔇';
        }

        function ensureAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return false;
                audioCtx = new AC();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return true;
        }

        function tone(midi, dur, type, vol, delay) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime + (delay || 0);
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type || 'sine';
            osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + dur + 0.05);
        }

        function playSE(name) {
            if (!soundOn) return;
            if (!ensureAudio()) return;
            if (name === 'click') {
                tone(88, 0.07, 'square', 0.035);
            } else if (name === 'pop') {
                tone(76, 0.1, 'sine', 0.1);
                tone(88, 0.12, 'sine', 0.08, 0.06);
            } else if (name === 'hint') {
                tone(84, 0.12, 'sine', 0.1);
                tone(91, 0.16, 'sine', 0.08, 0.08);
            } else if (name === 'correct') {
                [72, 76, 79, 84].forEach((n, i) => tone(n, 0.16, 'triangle', 0.12, i * 0.07));
            } else if (name === 'wrong') {
                tone(45, 0.22, 'sawtooth', 0.055);
                tone(41, 0.3, 'sawtooth', 0.055, 0.12);
            } else if (name === 'count') {
                tone(69, 0.1, 'square', 0.07);
            } else if (name === 'go') {
                tone(81, 0.3, 'square', 0.09);
            } else if (name === 'tick') {
                tone(93, 0.05, 'square', 0.045);
            } else if (name === 'timeup') {
                [81, 81, 81].forEach((n, i) => tone(n, 0.14, 'square', 0.08, i * 0.18));
            } else if (name === 'fanfare') {
                [72, 76, 79, 84, 79, 84, 88].forEach((n, i) => tone(n, 0.22, 'triangle', 0.12, i * 0.11));
            }
        }

        // BGM: 明るいオリジナルのループ（16ステップ）
        const BGM_MELODY = [72, 76, 79, 76, 81, 79, 76, 74, 72, 76, 79, 76, 79, 76, 74, 0];
        const BGM_BASS = [48, 0, 55, 0, 53, 0, 55, 0, 48, 0, 55, 0, 50, 0, 55, 0];

        function startBGM() {
            if (!soundOn || bgmTimer) return;
            if (!ensureAudio()) return;
            bgmTimer = setInterval(() => {
                if (!soundOn || document.hidden) return;
                const m = BGM_MELODY[bgmStep % 16];
                const b = BGM_BASS[bgmStep % 16];
                if (m) tone(m, 0.19, 'triangle', 0.04);
                if (b) tone(b, 0.19, 'sine', 0.045);
                bgmStep++;
            }, 210);
        }

        function stopBGM() {
            if (bgmTimer) {
                clearInterval(bgmTimer);
                bgmTimer = null;
            }
        }

        function toggleSound() {
            soundOn = !soundOn;
            saveSettings();
            updateSoundButton();
            if (soundOn) {
                bgmStarted = true;
                ensureAudio();
                startBGM();
                playSE('pop');
            } else {
                // 音オフではBGMも効果音も完全に止める
                stopBGM();
                if (audioCtx) audioCtx.suspend();
            }
        }

        // 画面を離れたら音を止める（戻ったら再開）
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopBGM();
                if (audioCtx) audioCtx.suspend();
            } else if (soundOn && bgmStarted) {
                ensureAudio();
                startBGM();
            }
        });

        // 最初のタップでBGM開始（自動再生制限のため）
        document.addEventListener('pointerdown', () => {
            if (!bgmStarted) {
                bgmStarted = true;
                if (soundOn) startBGM();
            }
        });

        // ボタンのクリック音
        document.addEventListener('click', (e) => {
            if (e.target.closest('.btn, .back-btn, .collection-item, .hint-btn')) {
                playSE('click');
            }
        });

        // 初期化
        loadSettings();
        loadProgress();
        updateStartButton();
    </script>
</body>
</html>
